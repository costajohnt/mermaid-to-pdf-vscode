name: Release

# release-please keeps a release PR open on main. Merging it creates the
# cli-vX.Y.Z / mcp-vX.Y.Z tags and GitHub releases, then the publish job
# below ships the released packages to npm. No local tag push is needed.
#
# Publishing uses npm trusted publishing (OIDC): the job's id-token mints the
# publish credential, so there is no NPM_TOKEN secret. Each package needs a
# trusted publisher on npmjs.com for repo costajohnt/mermaid-to-pdf-vscode,
# workflow release.yml, no environment.
#
# Run this workflow manually to republish an existing tag (for example after
# a failed publish). Versions already on npm are skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Package(s) to publish
        type: choice
        options: [both, cli, mcp]
        default: both
      tag:
        description: Existing release tag to check out and publish (e.g. cli-v2.0.0)
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      cli-released: ${{ steps.release.outputs.release_created }}
      cli-tag: ${{ steps.release.outputs.tag_name }}
      mcp-released: ${{ steps.release.outputs['mermaid-to-pdf-mcp--release_created'] }}
      mcp-tag: ${{ steps.release.outputs['mermaid-to-pdf-mcp--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: >-
      github.event_name == 'workflow_dispatch'
      || needs.release-please.outputs.cli-released == 'true'
      || needs.release-please.outputs.mcp-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach build output to the GitHub release
      id-token: write   # npm trusted publishing + provenance
    env:
      PUBLISH_CLI: ${{ github.event_name == 'workflow_dispatch' && inputs.package != 'mcp' || github.event_name == 'push' && needs.release-please.outputs.cli-released == 'true' }}
      PUBLISH_MCP: ${{ github.event_name == 'workflow_dispatch' && inputs.package != 'cli' || github.event_name == 'push' && needs.release-please.outputs.mcp-released == 'true' }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # Manual runs publish an existing tag; refs/tags/ rejects branch names.
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Build CLI tool
      run: npm run build

    # The MCP server depends on markdown-mermaid-converter-cli; link it to
    # this checkout so it builds and tests against the version being released.
    - name: Install MCP server dependencies
      run: cd mermaid-to-pdf-mcp && npm run install:local-cli

    - name: Run tests
      run: npm run test:all
      timeout-minutes: 10

    - name: Check the packed tarballs (CLI and MCP server) install and run
      run: npm run check:package

    # Trusted publishing needs npm >= 11.5.1. Upgrade only after install and
    # tests: npm 11 skips dependency install scripts by default, which would
    # skip Puppeteer's Chrome download and break the render tests.
    - name: Upgrade npm for trusted publishing
      run: npm install -g npm@latest && npm --version

    # The two packages have independent versions, so each publish is skipped
    # when that version is already on npm (makes a re-run safe).
    - name: Publish CLI to NPM
      if: env.PUBLISH_CLI == 'true'
      run: |
        VERSION=$(node -p "require('./package.json').version")
        if [ -n "$(npm view "markdown-mermaid-converter-cli@$VERSION" version 2>/dev/null)" ]; then
          echo "::notice::markdown-mermaid-converter-cli@$VERSION is already on npm, skipping"
        else
          npm publish --provenance --access public
        fi

    # Published after the CLI, which it depends on.
    - name: Publish MCP server to NPM
      if: env.PUBLISH_MCP == 'true'
      working-directory: mermaid-to-pdf-mcp
      run: |
        VERSION=$(node -p "require('./package.json').version")
        if [ -n "$(npm view "markdown-mermaid-converter-mcp@$VERSION" version 2>/dev/null)" ]; then
          echo "::notice::markdown-mermaid-converter-mcp@$VERSION is already on npm, skipping"
        else
          npm publish --provenance --access public
        fi

    - name: Attach build output to the CLI release
      if: github.event_name == 'push' && needs.release-please.outputs.cli-released == 'true'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ needs.release-please.outputs.cli-tag }}
        files: |
          dist/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
